name: mutation

# Kept apart from the required checks on purpose: a mutation score describes how
# the unit tests react to small rewrites of the rule code. It is not a count of real bugs caught.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker on policy, allowlist, recipients and worker decision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation
